name: M9 Fast Path candidate verification

on:
  workflow_dispatch:
  push:
    branches: [feature/fastpath-v1-m9-runtime, feature/fastpath-v1-m9-1-android-wiring]
    paths:
      - 'app/**'
      - 'observer/**'
      - 'docs/fast-path-v1/protocol-v1.1.experimental.schema.json'
      - 'app/src/test/resources/fastpathv1/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/m9-fastpath-runtime.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kotlin unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :observer:testDebugUnitTest
      - name: Build Companion and independent observer candidates
        run: gradle --no-daemon :app:assembleDebug :observer:assembleDebug
      - name: Record candidate artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-provenance
          for entry in "companion:app:app/build/outputs/apk/debug/app-debug.apk" "observer:observer:observer/build/outputs/apk/debug/observer-debug.apk"; do
            IFS=: read -r label module path <<< "$entry"
            test -s "$path"
            {
              echo "source_commit=$(git rev-parse HEAD)"
              echo "source_branch=${GITHUB_REF_NAME}"
              echo "artifact=$label"
              echo "apk_sha256=$(sha256sum "$path" | cut -d' ' -f1)"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$path" | grep 'Signer #1 certificate SHA-256 digest:'
            } > "build-provenance/$label.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fastpath-v1-m9-candidate-apks-and-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            observer/build/outputs/apk/debug/observer-debug.apk
            app/build/test-results/testDebugUnitTest/
            observer/build/test-results/testDebugUnitTest/
            build-provenance/
          if-no-files-found: error
