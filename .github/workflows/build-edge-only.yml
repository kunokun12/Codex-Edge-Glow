name: Build Codex Companion (Persistent Signing)

on:
  push:
    branches:
      - feature/companion-v2-4-foreground-cleanup
    paths:
      - 'app/**'
      - '.github/workflows/build-edge-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate persistent signing secrets
        shell: bash
        env:
          CODEX_SIGNING_KEYSTORE_BASE64: ${{ secrets.CODEX_SIGNING_KEYSTORE_BASE64 }}
          CODEX_SIGNING_STORE_PASSWORD: ${{ secrets.CODEX_SIGNING_STORE_PASSWORD }}
          CODEX_SIGNING_KEY_ALIAS: ${{ secrets.CODEX_SIGNING_KEY_ALIAS }}
          CODEX_SIGNING_KEY_PASSWORD: ${{ secrets.CODEX_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in CODEX_SIGNING_KEYSTORE_BASE64 CODEX_SIGNING_STORE_PASSWORD CODEX_SIGNING_KEY_ALIAS CODEX_SIGNING_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub Actions signing secret: $key"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$CODEX_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codex-companion-signing.p12"
          keytool -list -keystore "$RUNNER_TEMP/codex-companion-signing.p12" \
            -storepass "$CODEX_SIGNING_STORE_PASSWORD" -alias "$CODEX_SIGNING_KEY_ALIAS" > /dev/null
          echo "CODEX_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/codex-companion-signing.p12" >> "$GITHUB_ENV"
      - name: Run Kotlin JVM unit tests (required gate)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload Kotlin JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastpath-v1-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Build Companion with persistent signing key
        env:
          CODEX_SIGNING_STORE_PASSWORD: ${{ secrets.CODEX_SIGNING_STORE_PASSWORD }}
          CODEX_SIGNING_KEY_ALIAS: ${{ secrets.CODEX_SIGNING_KEY_ALIAS }}
          CODEX_SIGNING_KEY_PASSWORD: ${{ secrets.CODEX_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signing certificate
        shell: bash
        env:
          CODEX_SIGNING_STORE_PASSWORD: ${{ secrets.CODEX_SIGNING_STORE_PASSWORD }}
          CODEX_SIGNING_KEY_ALIAS: ${{ secrets.CODEX_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -exportcert -rfc -keystore "$CODEX_SIGNING_KEYSTORE_PATH" \
            -storepass "$CODEX_SIGNING_STORE_PASSWORD" -alias "$CODEX_SIGNING_KEY_ALIAS" \
            > "$RUNNER_TEMP/expected.pem"
          keytool -printcert -file "$RUNNER_TEMP/expected.pem" | grep SHA256
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SDK_APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-verify.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-verify.txt"
      - name: Record APK build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-provenance
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo "package=com.codexedge.glow"
            echo "version_name=2.5.8-fixed-target-lease-read-candidate"
            echo "version_code=18"
            echo "build_variant=debug"
            echo "apk_sha256=$(sha256sum "$APK" | cut -d' ' -f1)"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:'
          } > build-provenance/BUILD-INFO.txt

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/codex-companion-signing.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-companion-v2-5-8-fixed-target-lease-read-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-provenance/BUILD-INFO.txt
          if-no-files-found: error
