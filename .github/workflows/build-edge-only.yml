name: Build Companion and Observer (Persistent Signing)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/companion-v2-4-foreground-cleanup
      - feature/companion-persistent-signing
    paths:
      - 'app/**'
      - 'observer/**'
      - '.github/scripts/**'
      - '.github/workflows/build-edge-only.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate persistent signing key and installed certificate pin
        shell: bash
        env:
          CODEX_SIGNING_KEYSTORE_BASE64: ${{ secrets.CODEX_SIGNING_KEYSTORE_BASE64 }}
          CODEX_SIGNING_STORE_PASSWORD: ${{ secrets.CODEX_SIGNING_STORE_PASSWORD }}
          CODEX_SIGNING_KEY_ALIAS: ${{ secrets.CODEX_SIGNING_KEY_ALIAS }}
          CODEX_SIGNING_KEY_PASSWORD: ${{ secrets.CODEX_SIGNING_KEY_PASSWORD }}
        run: bash .github/scripts/prepare-persistent-signing.sh
      - name: Run Android module unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :observer:testDebugUnitTest
      - name: Build Companion and Observer APKs
        env:
          CODEX_SIGNING_STORE_PASSWORD: ${{ secrets.CODEX_SIGNING_STORE_PASSWORD }}
          CODEX_SIGNING_KEY_ALIAS: ${{ secrets.CODEX_SIGNING_KEY_ALIAS }}
          CODEX_SIGNING_KEY_PASSWORD: ${{ secrets.CODEX_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :observer:assembleDebug
      - name: Verify APK identities and observer security contract
        run: bash .github/scripts/verify-candidate-apks.sh
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/codex-companion-signing.p12" "$RUNNER_TEMP/codex-companion-signing.der"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-companion-persistent-observer-persistent-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            observer/build/outputs/apk/debug/observer-debug.apk
            app/build/test-results/testDebugUnitTest/
            observer/build/test-results/testDebugUnitTest/
            build-provenance/
          if-no-files-found: error
